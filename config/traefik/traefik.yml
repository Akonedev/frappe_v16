# config/traefik/traefik.yml — Configuration statique Traefik v3

api:
  dashboard: true
  # insecure: true  # DÉSACTIVÉ — accès uniquement via HTTPS avec auth

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

providers:
  docker:
    exposedByDefault: false
    network: presse_claude_network
  file:
    directory: /etc/traefik/dynamic
    watch: false

metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: metrics

log:
  level: INFO

accessLog: {}

# Certificats auto-générés pour dev (pas de Let's Encrypt)
