# config/promtail/promtail.yml — Configuration Promtail pour Presse Claude
# Scrape les logs containers via socket Podman (compat Docker API)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://presse_claude_loki:3100/loki/api/v1/push

scrape_configs:
  # ── Logs containers via Docker/Podman socket ──────────────────────────────
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      # Ne garder que les containers presse_claude_*
      - source_labels: [container]
        regex: "presse_claude_.*"
        action: keep
    pipeline_stages:
      - docker: {}
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
